<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DAILY BRIEFING</title>
<meta name="theme-color" content="#F3F6FB">
<link rel="icon" href="assets/img/wave.webp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="데일리 브리핑">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
// 화면 폭 900px 이상(PC, 펼친 폴드 가로)은 PC 화면으로. 폴드를 접고 펴거나 돌려도 따라 바뀜. ?m=1 이면 휴대폰 화면 고정
if (!/[?&]m=1/.test(location.search)) { const wide = matchMedia("(min-width: 900px) and (min-height: 560px)"); if (wide.matches) location.replace("pc.html" + location.hash); wide.addEventListener("change", (e) => { if (e.matches) location.replace("pc.html" + location.hash); }); }
</script>
<link rel="stylesheet" href="assets/app.css">
<style>
/* 모바일 시안: 왼쪽 시안 도구, 오른쪽 휴대폰 화면. 좁은 화면에서는 휴대폰 화면만 꽉 차게. */
/* 앱 틀을 화면에 못 박아 둠: 휴대폰 주소창이 숨거나 나타나도 아래 메뉴가 항상 같은 자리에 있게.
   페이지 전체는 스크롤하지 않고, 안쪽 목록(.scroll)만 스크롤 */
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { background: #E9EDF3; }
.stage { position: fixed; inset: 0; display: flex; justify-content: center; }
.phone { width: 100%; max-width: 900px; height: 100%; display: flex; flex-direction: column; position: relative; overflow: hidden; padding-top: env(safe-area-inset-top, 0px); }
.nav { padding-bottom: max(14px, env(safe-area-inset-bottom, 0px)); }
.app .scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: thin; }
.app .scroll > * { flex: none; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* 머리 */
.hd { background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 10px 10px 20px; display: flex; flex-direction: column; flex: none; }
.hd-row { display: flex; align-items: center; gap: 2px; min-height: 44px; }
.hd-date { display: none; font-size: calc(12px * var(--s)); color: var(--sub); }
.hd .ttl { font-size: calc(18px * var(--sh)); font-weight: 800; letter-spacing: -0.025em; }
.hd .sp { margin-left: auto; }
.hb { width: 44px; height: 44px; border: none; background: none; color: var(--sub); display: inline-flex; align-items: center; justify-content: center; font-size: calc(16px * var(--s)); font-weight: 800; border-radius: 12px; flex: none; }
.hb svg { width: 19px; height: 19px; }
.hd-rule { display: none; }
.hd-link { font-size: calc(13px * var(--s)); font-weight: 700; color: #2457E6; background: none; border: none; padding: 8px 6px; }
.app[data-mode="jogan"] .hd { border-bottom: none; padding: 14px 20px 0; }
.app[data-mode="jogan"] .hd-date { display: block; }
.app[data-mode="jogan"] .hd-rule { display: block; margin-top: 10px; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--ink); height: 4px; }
.app[data-mode="jogan"] .hb { color: var(--ink); }
.app[data-mode="jogan"] .hd-link { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.app[data-mode="digest"] .hd { background: var(--bg); border-bottom: none; padding: 14px 16px 4px 20px; }
.app[data-mode="digest"] .hd-date { display: block; color: var(--faint); }
.app[data-mode="digest"] .hb { border-radius: 50%; border: 1px solid var(--line); background: #FFFFFF; color: var(--ink); margin-left: 6px; }
.app[data-mode="digest"] .hd-link { color: var(--ink); }

.quick { display: flex; flex-direction: column; gap: 8px; padding: 6px 10px 6px 0; animation: up .18s ease-out; }
.quick .q-h { display: flex; align-items: baseline; font-size: calc(13px * var(--s)); }
.quick .q-h span { margin-left: auto; color: var(--sub); }

/* 오늘 */
.head2 { display: flex; align-items: flex-end; gap: 12px; }
.head2 .d { font-size: calc(11px * var(--s)); font-weight: 700; letter-spacing: 0.14em; color: #2457E6; }
.head2 h1 { margin: 4px 0 0; font-size: calc(22px * var(--sh)); font-weight: 800; letter-spacing: -0.035em; text-wrap: balance; }
.head2 h1 b { color: #2457E6; }
.app[data-mode="jogan"] .head2 .d, .app[data-mode="digest"] .head2 .d { display: none; }
.app[data-mode="jogan"] .head2 h1 b, .app[data-mode="digest"] .head2 h1 b { color: inherit; }
.app[data-mode="jogan"] .head2 h1 { font-size: calc(15px * var(--sh)); letter-spacing: 0; }
.app[data-mode="digest"] .head2 h1 { font-size: calc(15px * var(--sh)); font-weight: 700; letter-spacing: 0; }
.mix { display: flex; gap: 3px; height: 7px; }
.mix i { border-radius: 4px; background: var(--c); }
.subh { font-size: calc(14px * var(--sh)); font-weight: 800; color: var(--sub); margin-top: 6px; letter-spacing: -0.01em; }

/* 분야 탭 */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
.tabs button { flex: none; height: 36px; padding: 0 13px; border-radius: 999px; display: flex; align-items: center; gap: 6px; font-size: calc(13px * var(--s)); font-weight: 700; background: var(--surface); border: 1px solid var(--line); color: var(--sub); }
.tabs button i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.app[data-mode="jogan"] .tabs button { border-radius: 0; border-color: var(--ink); background: none; }
.addbtn { height: 48px; flex: none; border-radius: 14px; border: 1.5px dashed var(--line); background: none; font-size: calc(14px * var(--s)); font-weight: 700; color: #2457E6; }
.app[data-mode="jogan"] .addbtn { border-radius: 0; border-color: var(--ink); color: var(--ink); }
.app[data-mode="digest"] .addbtn { color: var(--ink); }

/* 스크랩 */
.app[data-mode="jogan"] .pills button { border-radius: 0; }
.wide { height: 46px; border: none; border-radius: 12px; background: #2457E6; color: #FFFFFF; font-size: calc(14px * var(--s)); font-weight: 800; flex: none; }
.app[data-mode="jogan"] .wide, .app[data-mode="digest"] .wide { background: var(--btn-bg); color: var(--btn-fg); }
.app[data-mode="jogan"] .wide { border-radius: 0; }
.none { text-align: center; color: var(--faint); font-size: calc(13.5px * var(--s)); line-height: 1.6; padding: 40px 12px; }

/* 설정 */
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.box h3 { margin: 0; font-size: calc(15px * var(--sh)); font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 6px; }
.box h3 small { font-size: calc(12px * var(--s)); font-weight: 500; color: var(--faint); }
.box h3 .r { margin-left: auto; font-size: calc(13px * var(--s)); font-weight: 600; color: var(--sub); }
.app[data-mode="jogan"] .box { border: 1px solid var(--ink); }
.thumbs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.thumbs button { border: none; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: calc(12.5px * var(--s)); font-weight: 700; color: var(--sub); }
.thumbs .pv { width: 100%; aspect-ratio: 3 / 4; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; gap: 4px; padding: 8px 7px; border: 1px solid #DDE3EC; }
.thumbs button[aria-pressed="true"] { color: var(--ink); }
.thumbs button[aria-pressed="true"] .pv { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px #2457E6; }
.pv .ln { height: 4px; border-radius: 2px; display: block; }
.steps { display: flex; gap: 4px; background: var(--bg); border-radius: 12px; padding: 4px; }
.steps button { flex: 1; height: 44px; border: none; background: none; font-weight: 800; color: var(--sub); border-radius: 10px; }
.steps button[aria-pressed="true"] { background: var(--navy); color: var(--bg); }
.app[data-mode="jogan"] .steps, .app[data-mode="jogan"] .steps button { border-radius: 0; }
.mycat { display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: calc(14px * var(--s)); font-weight: 600; }
.mycat i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.mycat span { margin-left: auto; font-size: calc(12px * var(--s)); color: var(--faint); font-weight: 500; }
.mycat { width: 100%; border: none; background: none; padding: 0; text-align: left; color: var(--ink); border-top: 1px solid var(--line2); min-height: 46px; }
.mycat em { font-style: normal; font-size: calc(12.5px * var(--s)); font-weight: 700; color: #2457E6; margin-left: 10px; }
.app[data-mode="jogan"] .mycat em, .app[data-mode="digest"] .mycat em { color: var(--ink); }

/* 하단 메뉴 */
.nav { flex: none; background: var(--nav-bg); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 6px 14px; }
.attbtn { border: none; background: none; padding: 0; flex: none; }
.nav button { border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: calc(11px * var(--s)); font-weight: 600; color: var(--nav-off); }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--nav-on); font-weight: 800; }
.app[data-mode="jogan"] .nav { border-top: 2px solid var(--ink); padding: 0 8px 12px; }
.app[data-mode="jogan"] .nav svg { display: none; }
.app[data-mode="jogan"] .nav button { padding: 13px 0 8px; font-size: calc(13px * var(--s)); }
.app[data-mode="jogan"] .nav button[aria-current="page"] { box-shadow: inset 0 3px 0 var(--ink); }
.app[data-mode="digest"] .nav { margin: 0 14px 14px; border-radius: 18px; border: none; padding: 6px; }
.app[data-mode="digest"] .nav svg { display: none; }
.app[data-mode="digest"] .nav button { height: 44px; justify-content: center; border-radius: 13px; font-size: calc(13px * var(--s)); }
.app[data-mode="digest"] .nav button[aria-current="page"] { background: var(--bg); color: var(--ink); }
</style>
</head>
<body>
<div class="stage">
  <div class="phone app" id="app" data-mode="basic">
    <div class="screen" id="screen"></div>
    <nav class="nav" aria-label="하단 메뉴" id="nav"></nav>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
const app = $("#app");
let tab = "today", scrapTab = "t1", quick = false, topicMode = "news";
const TABS = [["today", "오늘", ICON.today], ["topics", "분야별", ICON.grid], ["scrap", "스크랩", ICON.star], ["dex", "도감", ICON.dex], ["settings", "설정", ICON.gear]];

function header(title, extra = "") {
  if (title) return `<header class="hd"><div class="hd-row"><span class="ttl">${title}</span><span class="sp"></span>${extra}</div></header>`;
  return `<header class="hd"><div class="hd-row"><div><div class="hd-date">${dotDate()}</div><div class="brand">DAILY <b>BRIEFING</b></div></div><span class="sp"></span>
    <button type="button" class="hb" data-quick aria-label="글자 크기" aria-expanded="${quick}"${quick ? ' style="background:var(--navy);color:var(--bg)"' : ""}>가</button><button type="button" class="hb" data-refresh aria-label="새로고침">${ICON.refresh}</button></div>${quick ? quickHTML() : ""}<div class="hd-rule"></div></header>`;
}
function quickHTML() {
  const sz = SIZES.find((x) => x[0] === S.size);
  return `<div class="quick" role="group" aria-label="글자 크기"><div class="q-h"><b>글자 크기</b><span>${sz[1]} · ${Math.round(S.size * 100)}%</span></div><div class="steps">${SIZES.map(([v, nm], i) => `<button type="button" data-size="${v}" aria-pressed="${S.size === v}" aria-label="${nm}" style="font-size:${13 + i * 3}px">가</button>`).join("")}</div></div>`;
}
function todayView() {
  const picks = S.arts.filter((a) => a.pick).sort((a, b) => a.pick - b.pick);
  const total = S.cats.reduce((n, c) => n + c.count, 0) || 1;
  return header() + `<div class="scroll">
    <div class="head2"><div style="flex:1;min-width:0"><div class="d">${longDate()}</div><h1>오늘 꼭 볼 기사 <b>5개</b></h1></div><button type="button" class="attbtn" data-tab="dex" aria-label="출석 현황 · 도감 보기">${attHTML()}</button></div>
    <div class="mix" aria-hidden="true">${S.cats.filter((c) => c.count).map((c) => `<i style="flex:${c.count};${cvars(c)}"></i>`).join("")}</div>
    ${topHTML()}
    <div class="list">${picks.map((a) => itemHTML(a, { n: a.pick })).join("")}</div>
    <div class="subh">분야별 새 소식</div>
    ${S.cats.slice(0, 2).map((c) => secHTML(c, 2)).join("")}
    <button type="button" class="addbtn" data-tab="topics">분야 모두 보기</button></div>`;
}
function topicsView() {
  const seg = `<div class="pills" role="tablist" style="padding-bottom:4px"><button type="button" data-tmv="news" aria-pressed="${topicMode === "news"}">기사</button><button type="button" data-tmv="stats" aria-pressed="${topicMode === "stats"}">통계</button></div>`;
  if (topicMode === "stats") return header("분야별", `<button type="button" class="hb" data-refresh aria-label="새로고침">${ICON.refresh}</button>`) + `<div class="scroll">${seg}${statsHTML(false)}</div>`;
  return header("분야별", `<button type="button" class="hd-link" data-addopen>+ 분야 추가</button><button type="button" class="hb" data-refresh aria-label="새로고침">${ICON.refresh}</button>`) + `<div class="scroll">${seg}
    <div class="tabs" role="list">${S.cats.map((c) => `<button type="button" role="listitem" data-jump="${c.id}" style="${cvars(c)}"><i></i>${esc(c.name)}</button>`).join("")}</div>
    ${S.cats.map((c) => `<div id="sec-${c.id}">${secHTML(c, 5, true)}</div>`).join("")}
    ${addSlotHTML()}</div>`;
}
function catView() {
  return `<header class="hd"><div class="hd-row"><button type="button" class="backbtn" data-back>‹ 분야별</button></div></header><div class="scroll">${catDetailHTML(S.catView.id, false)}</div>`;
}
function scrapView() {
  const mine = scrapList();
  const t = teamOf(scrapTab);
  const body = !t
    ? (mine.length ? `<div class="list">${mine.map((a) => itemHTML(a)).join("")}</div>` : `<div class="none">아직 스크랩한 기사가 없어요.<br>기사 옆 별표를 누르면 여기에 모여요.</div>`)
    : teamBodyHTML(t);
  return header("스크랩함") + `<div class="scroll"><div class="pills" style="flex-wrap:wrap"><button type="button" data-st="mine" aria-pressed="${!t}">내 스크랩 ${mine.length}</button>${S.teams.map((x) => `<button type="button" data-st="${x.id}" aria-pressed="${scrapTab === x.id}">${esc(x.name)} ${x.items.length}</button>`).join("")}<button type="button" data-teamstart style="border-style:dashed;color:#2457E6">+ 팀 만들기 · 참여</button></div>${body}</div>`;
}
function dexView() {
  return header("도감", `<span style="font-size:calc(12px * var(--s));color:var(--faint);padding-right:10px">출석 ${DEX.days}일 · 연속 ${DEX.streak}일</span>`) + `<div class="scroll">
    ${dexNextHTML()}${dexTabsHTML()}${dexGridHTML()}
    <div style="font-size:calc(12px * var(--s));color:var(--faint);line-height:1.6;text-align:center;padding:4px 8px 0">이삭이 40 · 새싹이 40 · 전설 25, 모두 105마리</div></div>`;
}
function thumb(m) {
  if (m === "basic") return `<span class="pv" style="background:#F3F6FB"><span style="font-size:7px;font-weight:850;color:#0E1A36">DAILY <span style="color:#2457E6">BRIEFING</span></span><span style="background:#fff;border:1px solid #C9D8F8;border-radius:5px;padding:5px;display:flex;flex-direction:column;gap:3px"><span class="ln" style="width:40%;background:#0E1A36"></span><span class="ln" style="background:#CBD5E4"></span></span><span style="background:#fff;border-radius:5px;padding:4px 5px;display:flex;flex-direction:column;gap:4px;box-shadow:inset 2px 0 0 #1E8A4C"><span class="ln" style="background:#CBD5E4"></span><span class="ln" style="width:60%;background:#CBD5E4"></span></span><span style="background:#fff;border-radius:5px;padding:4px 5px;box-shadow:inset 2px 0 0 #5B47D6"><span class="ln" style="background:#CBD5E4"></span></span></span>`;
  if (m === "jogan") return `<span class="pv" style="background:#F4F1EA;border-color:#D9D4C8;border-radius:4px"><span style="font-size:7px;font-weight:850;color:#17181C;border-bottom:1.5px solid #17181C;padding-bottom:2px">DAILY BRIEFING</span><span class="ln" style="height:6px;width:90%;background:#17181C;border-radius:0"></span><span class="ln" style="background:#BDB7AB;border-radius:0"></span><span style="border-top:2px solid #1E8A4C;margin-top:3px"></span><span class="ln" style="width:80%;background:#BDB7AB;border-radius:0"></span><span style="border-top:2px solid #5B47D6;margin-top:3px"></span><span class="ln" style="width:70%;background:#BDB7AB;border-radius:0"></span></span>`;
  return `<span class="pv" style="background:#FBF8F1;border-color:#E3DCCB"><span style="font-size:7px;font-weight:850;color:#1F2A23">DAILY BRIEFING</span><span style="background:#F2ECDD;border-radius:5px;padding:5px;display:flex;flex-direction:column;gap:3px"><span class="ln" style="background:#B9B09A"></span><span class="ln" style="width:60%;background:#B9B09A"></span></span><span style="width:46%;height:6px;background:linear-gradient(transparent 40%,#BFE5CB 40%)"></span><span class="ln" style="background:#D5CDBA"></span><span style="width:30%;height:6px;background:linear-gradient(transparent 40%,#D9D2FA 40%)"></span><span class="ln" style="width:80%;background:#D5CDBA"></span></span>`;
}
function settingsView() {
  const sz = SIZES.find((x) => x[0] === S.size);
  return header("설정") + `<div class="scroll">
    <section class="box" id="box-design"><h3>디자인<small>바꿔도 내용·스크랩은 그대로예요</small></h3>
      <div class="thumbs">${MODES.map(([m, nm]) => `<button type="button" data-mode="${m}" aria-pressed="${S.mode === m}">${thumb(m)}${nm}</button>`).join("")}</div></section>
    <section class="box" id="box-size"><h3>글자 크기<span class="r">${sz[1]} · ${Math.round(S.size * 100)}%</span></h3>
      <div class="steps">${SIZES.map(([v, nm], i) => `<button type="button" data-size="${v}" aria-pressed="${S.size === v}" aria-label="${nm}" style="font-size:${13 + i * 3}px">가</button>`).join("")}</div></section>
    <section class="box" style="gap:2px"><h3 style="padding-bottom:6px">내 분야<span class="r"><button type="button" class="lnk" data-addopen>+ 추가</button></span></h3>
      ${S.cats.map((c) => `<button type="button" class="mycat" data-edit="${c.id}" style="${cvars(c)}"><i></i>${esc(c.name)}<span>검색어 ${(c.words || []).length}개</span><em>수정 ›</em></button>`).join("")}</section>
    <section class="box" style="flex-direction:row;align-items:center"><div style="flex:1"><h3>PC·휴대폰 동기화 <button type="button" class="qhelp" data-synchelp aria-label="동기화 사용 방법">?</button></h3><div style="font-size:12px;color:var(--faint);margin-top:4px">${esc(syncLine())}</div></div><button type="button" class="lnk" data-sync>관리 ›</button></section>
    ${isStandalone() ? "" : `<button type="button" class="addbtn" data-a2hs>홈 화면에 추가하기</button>`}
    <button type="button" class="addbtn" data-tour>사용 안내 다시 보기</button>
    ${CREDIT}</div>`;
}
function render() {
  applyAppVars(app);
  const top = $("#screen .scroll") ? $("#screen .scroll").scrollTop : 0;
  $("#screen").innerHTML = { today: todayView, topics: topicsView, cat: catView, scrap: scrapView, dex: dexView, settings: settingsView }[tab]();
  if ($("#screen .scroll")) $("#screen .scroll").scrollTop = top;
  $("#nav").innerHTML = TABS.map(([k, nm, ic]) => `<button type="button" data-tab="${k}" ${tab === k || (tab === "cat" && k === "topics") ? 'aria-current="page"' : ""}>${ic}${nm}</button>`).join("");
  if (tab === "dex" && 5 - (DEX.days % 5) === 1) { const e = $(".dx-egg", app); if (e) e.classList.add("wob"); }
  applyFX(app);
}
function go(t) { const changed = t !== tab; tab = t; if (changed) FX.enter = "#screen .scroll"; const sc = $("#screen .scroll"); if (sc) sc.scrollTop = 0; render(); const s2 = $("#screen .scroll"); if (s2) s2.scrollTop = 0; }

loadPrefs(); loadDex();
bindCommon(app, render);
bindSync(app, render);
bindStats(app, render);
bindCat(app, render);
bindTeams(app, render, (id) => { scrapTab = id; tab = "scrap"; });
app.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.tab) { quick = false; go(b.dataset.tab); return; }
  if (b.dataset.quick !== undefined) { quick = !quick; render(); return; }
  if (b.dataset.refresh !== undefined) { refreshNews(app, b, render); return; }
  if (b.dataset.hxgo !== undefined) { $$(".hx", app).forEach((n) => n.remove()); setTimeout(() => hatchNext(app), 400); go("dex"); return; }
  if (b.dataset.hxclose !== undefined) { $$(".hx", app).forEach((n) => n.remove()); hatchNext(app); return; }
  if (b.dataset.gonew !== undefined) { $$(".newpill", app).forEach((n) => n.remove()); go("topics"); return; }
  if (b.dataset.more) { S.catView = { id: b.dataset.more, sort: "new", unread: false }; go("cat"); return; }
  if (b.dataset.back !== undefined) { go("topics"); const el = $("#sec-" + S.catView.id); if (el) el.scrollIntoView({ block: "start" }); return; }
  if (b.dataset.jump) { const el = $("#sec-" + b.dataset.jump); if (el) el.scrollIntoView({ block: "start", behavior: "smooth" }); return; }
  if (b.dataset.st) { scrapTab = b.dataset.st; render(); return; }
  if (b.dataset.tmv) { topicMode = b.dataset.tmv; render(); $("#screen .scroll").scrollTop = 0; return; }
  if (b.dataset.mode && b.closest(".thumbs")) { S.mode = b.dataset.mode; savePrefs(); render(); return; }
  if (b.dataset.size) { S.size = +b.dataset.size; savePrefs(); render(); return; }
  if (b.dataset.delcat) { S.cats = S.cats.filter((c) => c.id !== b.dataset.delcat); pruneArts(); savePrefs(); render(); toast(app, "분야를 삭제했어요"); return; }
  if (b.dataset.replay !== undefined) { playIntro(app); return; }
  if (b.dataset.tour !== undefined) { tour(); return; }
  if (b.dataset.a2hs !== undefined) { showA2HS(app); return; }
});
function tour() { startTour(app, (t) => { if (t !== tab) { tab = t; render(); const sc = $("#screen .scroll"); if (sc) sc.scrollTop = 0; } }, render); }
bootNews(render);
S.afterTour = () => { if (a2hsDue()) showA2HS(app); };
const firstTour = () => { if (!tourSeen()) tour(); else setTimeout(S.afterTour, 800); };
if (!sessionStorage.getItem("db-intro")) { sessionStorage.setItem("db-intro", "1"); playIntro(app, firstTour); } else firstTour();
